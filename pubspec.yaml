name: paper_tradingview_terminal
description: A Flutter app for paper and real trading on TradingView with CLI terminal, API vault, push notifications, portfolio dashboard, and multi-timeframe charts.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  http: ^1.2.1
  web_socket_channel: ^2.4.0
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.2
  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true